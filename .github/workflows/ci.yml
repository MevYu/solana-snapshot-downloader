name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Check source entry points
        run: |
          python3 snapshot_downloader.py --help
          python3 -m solana_snapshot_downloader --version
      - name: Build and check archives
        run: |
          python3 tools/build_release.py
          python3 dist/solana-snapshot-downloader-*.pyz --version
          cd dist
          sha256sum -c SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check version matches tag
        run: |
          python3 - <<'PY'
          import os
          from solana_snapshot_downloader import __version__
          assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag must match package version'
          PY
      - name: Build
        run: python3 tools/build_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.pyz dist/*.tar.gz dist/SHA256SUMS
          --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
